version: "3.8"

services:
  intercom-mcp:
    build: .
    image: intercom-mcp-server
    container_name: intercom-mcp-server
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3004/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  intercom-daily-report:
    build: .
    image: intercom-mcp-server
    container_name: intercom-daily-report
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "daily_report.py"]
